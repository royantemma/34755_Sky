<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Robot 3D View</title>
    <style>
        body { margin: 0; background-color: #e0e0e0; font-family: sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .widget-box {
            position: relative;
            width: 90vw;
            max-width: 1200px;
            height: 70vh;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.2);
            overflow: hidden;
        }
        #canvas-container { width: 100%; height: 100%; display: block; }
        #ui-panel {
            position: absolute;
            bottom: 20px;
            left: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.85);
            padding: 10px 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }
        .control-group {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .control-group label {
            font-weight: bold;
        }
        .control-group input {
            width: 60px;
            text-align: right;
            border: 1px solid #ccc;
            border-radius: 4px;
            padding: 4px;
        }
        .control-group span {
            font-size: 0.9em;
            color: #666;
            margin-right: 10px;
        }
        button {
            padding: 6px 15px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background: #0056b3;
        }
        h3 { margin: 0; padding-right: 15px; border-right: 2px solid #ccc; font-size: 1.1em; color: #333; }
    </style>
    <!-- Import maps for Three.js -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <div class="widget-box">
        <div id="canvas-container"></div>
        <div id="ui-panel">
            <h3>Pose</h3>
            
            <div class="control-group">
                <label for="posX">X</label>
                <input type="number" id="posX" value="0" step="10">
                <span>mm</span>
            </div>
            <div class="control-group">
                <label for="posY">Y</label>
                <input type="number" id="posY" value="0" step="10">
                <span>mm</span>
            </div>
            <div class="control-group">
                <label for="posZ">Z</label>
                <input type="number" id="posZ" value="0" step="10">
                <span>mm</span>
            </div>
            
            <div class="control-group">
                <label for="rotRoll">Roll</label>
                <input type="number" id="rotRoll" value="0" step="5">
                <span>deg</span>
            </div>
            <div class="control-group">
                <label for="rotPitch">Pitch</label>
                <input type="number" id="rotPitch" value="0" step="5">
                <span>deg</span>
            </div>
            <div class="control-group">
                <label for="rotYaw">Yaw</label>
                <input type="number" id="rotYaw" value="0" step="5">
                <span>deg</span>
            </div>

            <button id="resetBtn">Reset</button>
        </div>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';

        // --- Viewport & Scene Setup ---
        // We will assume 1 unit in Three.js = 1 mm.
        THREE.Object3D.DEFAULT_UP.set(0, 0, 1);

        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xf0f0f0); // light gray background

        // Camera
        // Perspective camera with parameters: FOV, aspect ratio, near, far
        const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 10, 50000);
        camera.up.set(0, 0, 1);
        camera.position.set(2000, -4000, 4000); // Start far out to see mm-scale objects

        // Renderer
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.shadowMap.enabled = true; // Optional: shadows
        container.appendChild(renderer.domElement);

        // Controls
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.target.set(0, 0, 0); // Target origin

        // --- Lights ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6); // Soft white light
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(5000, 5000, 2000);
        dirLight.castShadow = true;
        scene.add(dirLight);

        // --- Helpers ---
        // (Grid and Axes helpers removed to show only 3D models)

        // --- Logic & Model Loading ---
        
        let robotModel = new THREE.Group(); // Empty group to be replaced/filled with real model
        scene.add(robotModel);
        
        // Add a placeholder box so it looks like a robot before models are loaded
        const geometry = new THREE.BoxGeometry(200, 300, 150); // Typical smaller robot size in mm
        const material = new THREE.MeshLambertMaterial({ color: 0xff0000 });
        const placeholderMesh = new THREE.Mesh(geometry, material);
        placeholderMesh.position.z = 75; // Offset half height if Z is Up
        robotModel.add(placeholderMesh);

        // Loader for FBX models (Exported from Fusion 360)
        const loader = new FBXLoader();

        // Load Map Model
        loader.load('3D/map.fbx', function (object) {
            scene.add(object);
        }, undefined, function (error) {
            console.log('Map model missing or failed to load. Export from Fusion to "stream_server/3D/map.fbx".', error);
        });

        // Load Robot Model
        loader.load('3D/robot.fbx', function (object) {
            robotModel.remove(placeholderMesh); // Remove the placeholder box
            robotModel.add(object);
        }, undefined, function (error) {
            console.log('Robot model missing or failed to load. Export from Fusion to "stream_server/3D/robot.fbx".', error);
        });

        // --- UI Binding ---
        const inputs = {
            x: document.getElementById('posX'),
            y: document.getElementById('posY'),
            z: document.getElementById('posZ'),
            r: document.getElementById('rotRoll'),
            p: document.getElementById('rotPitch'),
            yw: document.getElementById('rotYaw'),
        };

        function updateRobotPose() {
            if (!robotModel) return;

            // Update Position (in mm)
            robotModel.position.x = parseFloat(inputs.x.value) || 0;
            robotModel.position.y = parseFloat(inputs.y.value) || 0;
            robotModel.position.z = parseFloat(inputs.z.value) || 0;

            // Update Rotation (from degrees to radians).
            // Three.js uses "XYZ" Euler order by default.
            // Depending heavily on your coordinate system in Fusion. Assume standard WebGL (Y-up) or Z-up. 
            // In robotics, Z is often UP.
            
            const rollRad = THREE.MathUtils.degToRad(parseFloat(inputs.r.value) || 0);
            const pitchRad = THREE.MathUtils.degToRad(parseFloat(inputs.p.value) || 0);
            const yawRad = THREE.MathUtils.degToRad(parseFloat(inputs.yw.value) || 0);

            // Applying Euler rotations. 
            robotModel.rotation.set(rollRad, pitchRad, yawRad, 'XYZ'); 
        }

        // Add event listeners to input fields
        Object.values(inputs).forEach(input => {
            input.addEventListener('input', updateRobotPose);
        });

        // Reset Button
        document.getElementById('resetBtn').addEventListener('click', () => {
            Object.values(inputs).forEach(input => input.value = 0);
            updateRobotPose();
        });

        // Resize handler
        window.addEventListener('resize', () => {
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        });

        // --- Animation Loop ---
        function animate() {
            requestAnimationFrame(animate);
            controls.update(); // only required if controls.enableDamping or controls.autoRotate are set
            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
</html>
